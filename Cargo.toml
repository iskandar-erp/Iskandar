[workspace]
resolver = "2"
members = [
    "crates/iskandar-core",
    "crates/iskandar-api",
    "crates/iskandar-cli",
    "crates/providers/iskandar-microsip",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/iskandar-erp/iskandar"
authors = ["DCA Analytics"]

[workspace.dependencies]
# Crates del workspace
iskandar-core = { path = "crates/iskandar-core" }
iskandar-api = { path = "crates/iskandar-api" }
iskandar-microsip = { path = "crates/providers/iskandar-microsip" }

# Externas
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
